services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pfa
      POSTGRES_USER: pfa
      POSTGRES_PASSWORD: ${PFA_POSTGRES_PASSWORD:?Set PFA_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfa -d pfa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
