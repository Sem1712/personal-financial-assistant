[project]
name = "personal-financial-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-calamine>=0.9.1",
    "ruff>=0.17.6",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
personal-financial-assistant = "personal_financial_assistant:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-playwright>=0.10.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
